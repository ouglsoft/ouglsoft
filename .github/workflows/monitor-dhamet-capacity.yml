name: Monitor Dhamet Cloudflare Capacity

on:
  schedule:
    - cron: "2,22,42 * * * *"
  workflow_dispatch:
    inputs:
      force_mode:
        description: "auto, cloudflare, or backup-emergency"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - cloudflare
          - backup-emergency

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dhamet-capacity-monitor
  cancel-in-progress: true

jobs:
  monitor:

    if: github.event_name == 'workflow_dispatch' || vars.DHAMET_AUTO_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_MODE: ${{ inputs.force_mode || 'auto' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      DHAMET_BACKUP_CONTROL_SECRET: ${{ secrets.DHAMET_BACKUP_CONTROL_SECRET }}
      DHAMET_BACKUP_URL: ${{ vars.DHAMET_BACKUP_URL }}
      DHAMET_ROUTE_STATUS_ENDPOINT: ${{ vars.DHAMET_ROUTE_STATUS_ENDPOINT }}
      DHAMET_ROUTE_CONTROL_ENDPOINT: ${{ vars.DHAMET_ROUTE_CONTROL_ENDPOINT }}
      DHAMET_ACTIVATION_THRESHOLD: ${{ vars.DHAMET_ACTIVATION_THRESHOLD || '90' }}
      DHAMET_RESET_GRACE_MINUTES: "2"


      DHAMET_CONFIRMATION_REQUIRED_RUNS: ${{ vars.DHAMET_CONFIRMATION_REQUIRED_RUNS || '3' }}
      DHAMET_CONFIRMATION_MIN_GAP_MS: "120000"
      DHAMET_CONFIRMATION_MAX_GAP_MS: ${{ vars.DHAMET_CONFIRMATION_MAX_GAP_MS || '720000' }}
      FIREBASE_ROUTE_CONTROL_URL: ${{ vars.FIREBASE_ROUTE_CONTROL_URL || 'https://dhamet2-default-rtdb.firebaseio.com/system/backupRoute.json' }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_ROUTE_CONTROL_TOKEN: ${{ secrets.FIREBASE_ROUTE_CONTROL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read Cloudflare GraphQL analytics and update online routing
        id: capacity_initial
        run: node monitor/cloudflare-backup-router.mjs

      - name: Confirm detected threshold after two minutes
        id: capacity_confirmation_2
        if: steps.capacity_initial.outputs.confirmation_pending == 'true'
        run: |
          sleep 120
          node monitor/cloudflare-backup-router.mjs

      - name: Confirm detected threshold a third time
        id: capacity_confirmation_3
        if: steps.capacity_confirmation_2.outputs.confirmation_pending == 'true'
        run: |
          sleep 120
          node monitor/cloudflare-backup-router.mjs

      - name: Disable capacity monitor until the next quota reset
        if: >-
          steps.capacity_initial.outputs.disable_monitor == 'true' ||
          steps.capacity_confirmation_2.outputs.disable_monitor == 'true' ||
          steps.capacity_confirmation_3.outputs.disable_monitor == 'true'
        uses: actions/github-script@v7
        env:
          DISABLE_REASON: ${{ steps.capacity_confirmation_3.outputs.disable_reason || steps.capacity_confirmation_2.outputs.disable_reason || steps.capacity_initial.outputs.disable_reason }}
        with:
          script: |
            await github.request('PUT /repos/{owner}/{repo}/actions/workflows/{workflow_id}/disable', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'monitor-dhamet-capacity.yml',
            });
            core.info(`Capacity monitor disabled: ${process.env.DISABLE_REASON}`);

      - name: Report monitor failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Dhamet capacity monitor failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The Dhamet capacity monitor failed on ${new Date().toISOString()}.\n\nRun: ${runUrl}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
