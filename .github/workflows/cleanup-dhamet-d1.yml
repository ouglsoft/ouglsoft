name: Clean Dhamet D1

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhamet-d1-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deployment dependency
        run: npm ci

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply dhamet2_test --remote --config dhamet/worker/wrangler.toml

      - name: Delete expired D1 data in bounded batches
        run: npx wrangler d1 execute dhamet2_test --remote --config dhamet/worker/wrangler.toml --file dhamet/worker/maintenance/cleanup.sql
