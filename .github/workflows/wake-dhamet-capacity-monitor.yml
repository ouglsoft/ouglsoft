name: Wake Dhamet Capacity Monitor

on:
  schedule:


    - cron: "3 0 * * *"
    - cron: "8 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dhamet-capacity-monitor-wakeup
  cancel-in-progress: true

jobs:
  wake:
    if: vars.DHAMET_AUTO_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable the capacity monitor
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = 'monitor-dhamet-capacity.yml';
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
            };
            const current = await github.request(
              'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}',
              common,
            );
            if (current.data && current.data.state === 'active') {
              core.info('Dhamet capacity monitor is already active; no wake-up dispatch is needed.');
              return;
            }
            await github.request(
              'PUT /repos/{owner}/{repo}/actions/workflows/{workflow_id}/enable',
              common,
            );
            await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              ...common,
              ref: context.payload.repository.default_branch,
              inputs: { force_mode: 'auto' },
            });
            core.info('Dhamet capacity monitor enabled and started for the new UTC quota day.');
